<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-label="Two three-candle star patterns: a morning star (big red, small pause candle, big green) forming a valley, and an evening star (big green, small pause candle, big red) forming a peak">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <line x1="300" y1="28" x2="300" y2="150" stroke="#e7e3d8" stroke-width="1"/>
        <polyline fill="none" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="4 4" points="90,98 150,122 210,60"/>
        <polyline fill="none" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="4 4" points="390,60 450,50 510,104"/>
        <!-- Morning star -->
        <line x1="90" y1="46" x2="90" y2="104" stroke="#57606a" stroke-width="1.8"/>
        <rect x="78" y="52" width="24" height="46" rx="2" fill="#f7e2de" stroke="#c0392b" stroke-width="2.2"/>
        <line x1="150" y1="110" x2="150" y2="134" stroke="#57606a" stroke-width="1.8"/>
        <rect x="138" y="116" width="24" height="12" rx="2" fill="#f1efe8" stroke="#57606a" stroke-width="2.2"/>
        <line x1="210" y1="54" x2="210" y2="118" stroke="#57606a" stroke-width="1.8"/>
        <rect x="198" y="60" width="24" height="52" rx="2" fill="#e3f3e8" stroke="#1a7f37" stroke-width="2.2"/>
        <text class="dg-t" text-anchor="middle" x="150" y="178" style="fill:#1a7f37">Morning star</text>
        <text class="dg-xs" text-anchor="middle" x="150" y="196">down → pause → up: a possible bottom</text>
        <!-- Evening star -->
        <line x1="390" y1="54" x2="390" y2="118" stroke="#57606a" stroke-width="1.8"/>
        <rect x="378" y="60" width="24" height="52" rx="2" fill="#e3f3e8" stroke="#1a7f37" stroke-width="2.2"/>
        <line x1="450" y1="38" x2="450" y2="62" stroke="#57606a" stroke-width="1.8"/>
        <rect x="438" y="44" width="24" height="12" rx="2" fill="#f1efe8" stroke="#57606a" stroke-width="2.2"/>
        <line x1="510" y1="46" x2="510" y2="110" stroke="#57606a" stroke-width="1.8"/>
        <rect x="498" y="52" width="24" height="52" rx="2" fill="#f7e2de" stroke="#c0392b" stroke-width="2.2"/>
        <text class="dg-t" text-anchor="middle" x="450" y="178" style="fill:#c0392b">Evening star</text>
        <text class="dg-xs" text-anchor="middle" x="450" y="196">up → pause → down: a possible top</text>
      </svg>
