<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 152" role="img" aria-label="Ten trader figures: nine red ones who lost money and one green one who came out ahead">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <text class="dg-t" text-anchor="middle" x="300" y="26">Out of every 10 F&amp;O traders…</text>
        <g>
          <circle cx="48" cy="52" r="9" fill="#c0392b"/><path d="M33,94 C33,66 63,66 63,94 Z" fill="#c0392b"/>
          <circle cx="102" cy="52" r="9" fill="#c0392b"/><path d="M87,94 C87,66 117,66 117,94 Z" fill="#c0392b"/>
          <circle cx="156" cy="52" r="9" fill="#c0392b"/><path d="M141,94 C141,66 171,66 171,94 Z" fill="#c0392b"/>
          <circle cx="210" cy="52" r="9" fill="#c0392b"/><path d="M195,94 C195,66 225,66 225,94 Z" fill="#c0392b"/>
          <circle cx="264" cy="52" r="9" fill="#c0392b"/><path d="M249,94 C249,66 279,66 279,94 Z" fill="#c0392b"/>
          <circle cx="318" cy="52" r="9" fill="#c0392b"/><path d="M303,94 C303,66 333,66 333,94 Z" fill="#c0392b"/>
          <circle cx="372" cy="52" r="9" fill="#c0392b"/><path d="M357,94 C357,66 387,66 387,94 Z" fill="#c0392b"/>
          <circle cx="426" cy="52" r="9" fill="#c0392b"/><path d="M411,94 C411,66 441,66 441,94 Z" fill="#c0392b"/>
          <circle cx="480" cy="52" r="9" fill="#c0392b"/><path d="M465,94 C465,66 495,66 495,94 Z" fill="#c0392b"/>
          <circle cx="534" cy="52" r="9" fill="#1a7f37"/><path d="M519,94 C519,66 549,66 549,94 Z" fill="#1a7f37"/>
