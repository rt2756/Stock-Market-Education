<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 232" role="img" aria-label="The premium of an at the money weekly option through its final day: it opens near 95 rupees, nearly doubles on a quick index rally, gives it all back within an hour, and melts to zero by the 3:30 close">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <text class="dg-t" text-anchor="middle" x="300" y="22">An ATM weekly option on its own expiry day (0DTE)</text>
        <rect x="455" y="40" width="105" height="150" fill="#f7e2de" opacity="0.5"/>
        <text class="dg-xs" text-anchor="middle" x="507" y="54" style="fill:#c0392b">melts by the minute</text>
        <line x1="60" y1="40" x2="60" y2="190" stroke="#cfc9ba" stroke-width="1.5"/>
        <line x1="60" y1="190" x2="560" y2="190" stroke="#cfc9ba" stroke-width="1.5"/>
        <path d="M60,86 C85,80 100,96 122,90 C150,82 165,58 192,52 C212,47 228,46 240,48 C262,54 272,92 295,104 C318,116 332,108 352,124 C375,140 395,148 415,156 C440,166 475,178 505,185 C530,190 548,190 556,190" fill="none" stroke="#0b6e6e" stroke-width="2.4" stroke-linecap="round"/>
        <text class="dg-xs" x="66" y="54">premium (₹)</text>
        <text class="dg-xs" x="66" y="78">opens ₹95</text>
        <text class="dg-xs" text-anchor="middle" x="218" y="36">a quick index pop nearly doubles it…</text>
        <text class="dg-xs" text-anchor="middle" x="352" y="92">…an hour of drift gives it all back</text>
        <g stroke="#cfc9ba" stroke-width="1.2">
          <line x1="185" y1="190" x2="185" y2="196"/>
          <line x1="310" y1="190" x2="310" y2="196"/>
          <line x1="435" y1="190" x2="435" y2="196"/>
        </g>
        <g text-anchor="middle">
          <text class="dg-xs" x="60" y="212">9:15</text>
          <text class="dg-xs" x="185" y="212">11:00</text>
          <text class="dg-xs" x="310" y="212">1:00</text>
          <text class="dg-xs" x="435" y="212">2:30</text>
          <text class="dg-xs" x="548" y="212">3:30</text>
        </g>
      </svg>
