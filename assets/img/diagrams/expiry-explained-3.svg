<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 248" role="img" aria-label="At 3:30 pm on expiry day the exchange settles every open option: in the money options are auto-exercised and the cash difference is credited minus charges, out of the money options expire worthless and simply vanish">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <defs>
          <marker id="exp2-g" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1a7f37"/></marker>
          <marker id="exp2-r" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
        </defs>
        <rect x="170" y="34" width="260" height="48" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.6"/>
        <text class="dg-t" text-anchor="middle" x="300" y="54">3:30 pm on expiry day</text>
        <text class="dg-xs" text-anchor="middle" x="300" y="72">the exchange takes over — nothing to click</text>
        <line x1="268" y1="84" x2="170" y2="112" stroke="#1a7f37" stroke-width="2" marker-end="url(#exp2-g)"/>
        <line x1="332" y1="84" x2="430" y2="112" stroke="#c0392b" stroke-width="2" marker-end="url(#exp2-r)"/>
        <rect x="40" y="118" width="240" height="92" rx="10" fill="#eaf6ec" stroke="#1a7f37" stroke-width="1.8"/>
        <text class="dg-t" text-anchor="middle" x="160" y="142" style="fill:#1a7f37">Finished ITM</text>
        <text class="dg-xs" text-anchor="middle" x="160" y="162">auto-exercised — the cash</text>
        <text class="dg-xs" text-anchor="middle" x="160" y="178">difference is credited to you</text>
        <text class="dg-xs" text-anchor="middle" x="160" y="194">(minus STT &amp; charges)</text>
        <rect x="320" y="118" width="240" height="92" rx="10" fill="#f7e2de" stroke="#c0392b" stroke-width="1.8"/>
        <text class="dg-t" text-anchor="middle" x="440" y="142" style="fill:#c0392b">Finished OTM</text>
        <text class="dg-xs" text-anchor="middle" x="440" y="162">expires worthless — the premium</text>
        <text class="dg-xs" text-anchor="middle" x="440" y="178">is gone; the contract vanishes</text>
        <text class="dg-xs" text-anchor="middle" x="440" y="194">(nothing further owed)</text>
        <text class="dg-xs" text-anchor="middle" x="300" y="236" style="fill:#57606a">index options settle in cash · stock options settle in actual shares — see the warning below</text>
      </svg>
