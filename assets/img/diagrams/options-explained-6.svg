<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="A simplified option chain for Nifty: strikes from 23,300 to 23,700 down the middle, call premiums and open interest on the left, put premiums and open interest on the right, with the at the money 23,500 row highlighted">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <text class="dg-t" text-anchor="middle" x="224" y="22">An option chain, decoded</text>
        <rect x="24" y="38" width="400" height="280" rx="12" fill="#ffffff" stroke="#cfc9ba" stroke-width="1.6"/>
        <text class="dg-xs" x="40" y="62">NIFTY · spot 23,500 · weekly expiry Tue 16 Jun</text>
        <text class="dg-t" text-anchor="middle" x="110" y="88" style="fill:#0b6e6e">CALLS — right to buy</text>
        <text class="dg-t" text-anchor="middle" x="338" y="88" style="fill:#c0392b">PUTS — right to sell</text>
        <line x1="190" y1="96" x2="190" y2="296" stroke="#e7e3d8" stroke-width="1"/>
        <line x1="258" y1="96" x2="258" y2="296" stroke="#e7e3d8" stroke-width="1"/>
        <g text-anchor="middle">
          <text class="dg-xs" x="70" y="110">OI</text>
          <text class="dg-xs" x="146" y="110">prem ₹</text>
          <text class="dg-xs" x="224" y="110">STRIKE</text>
          <text class="dg-xs" x="302" y="110">prem ₹</text>
          <text class="dg-xs" x="378" y="110">OI</text>
        </g>
        <rect x="32" y="188" width="384" height="36" rx="6" fill="#fbf3e0"/>
        <g stroke="#e7e3d8" stroke-width="0.8">
          <line x1="36" y1="152" x2="412" y2="152"/>
          <line x1="36" y1="188" x2="412" y2="188"/>
          <line x1="36" y1="224" x2="412" y2="224"/>
          <line x1="36" y1="260" x2="412" y2="260"/>
        </g>
        <g text-anchor="middle">
          <text class="dg-xs" x="70" y="138">31k</text><text class="dg-s" x="146" y="138">260</text><text class="dg-t" x="224" y="138">23,300</text><text class="dg-s" x="302" y="138">55</text><text class="dg-xs" x="378" y="138">95k</text>
          <text class="dg-xs" x="70" y="174">48k</text><text class="dg-s" x="146" y="174">185</text><text class="dg-t" x="224" y="174">23,400</text><text class="dg-s" x="302" y="174">82</text><text class="dg-xs" x="378" y="174">120k</text>
          <text class="dg-xs" x="70" y="210">92k</text><text class="dg-s" x="146" y="210">125</text><text class="dg-t" x="224" y="210">23,500</text><text class="dg-s" x="302" y="210">120</text><text class="dg-xs" x="378" y="210">88k</text>
          <text class="dg-xs" x="70" y="246">140k</text><text class="dg-s" x="146" y="246">78</text><text class="dg-t" x="224" y="246">23,600</text><text class="dg-s" x="302" y="246">172</text><text class="dg-xs" x="378" y="246">52k</text>
          <text class="dg-xs" x="70" y="282">110k</text><text class="dg-s" x="146" y="282">45</text><text class="dg-t" x="224" y="282">23,700</text><text class="dg-s" x="302" y="282">240</text><text class="dg-xs" x="378" y="282">26k</text>
        </g>
        <g stroke="#cfc9ba" stroke-width="1.2">
          <line x1="424" y1="120" x2="434" y2="120"/>
          <line x1="424" y1="206" x2="434" y2="206"/>
          <line x1="424" y1="274" x2="434" y2="274"/>
        </g>
        <text class="dg-t" x="438" y="116">① the strike ladder</text>
        <text class="dg-xs" x="438" y="131">steps of 50–100 pts</text>
        <text class="dg-t" x="438" y="202">② the ATM row</text>
        <text class="dg-xs" x="438" y="217">spot sits here</text>
        <text class="dg-t" x="438" y="266">③ OI — contracts</text>
        <text class="dg-xs" x="438" y="281">currently open; busy</text>
        <text class="dg-xs" x="438" y="295">= easy in &amp; out</text>
        <text class="dg-xs" text-anchor="middle" x="224" y="340" style="fill:#57606a">call ₹ shrinks as strikes climb · put ₹ shrinks as strikes fall</text>
      </svg>
