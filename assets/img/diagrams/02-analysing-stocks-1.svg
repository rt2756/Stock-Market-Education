<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="Two lenses on the same stock: fundamental analysis checks the business, technical analysis reads the price chart">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <line x1="300" y1="36" x2="300" y2="208" stroke="#e7e3d8" stroke-width="1"/>
        <!-- Fundamental -->
        <text class="dg-t" text-anchor="middle" x="150" y="46">Fundamental</text>
        <text class="dg-xs" text-anchor="middle" x="150" y="64">studies the business</text>
        <g>
          <path d="M82,100 l5,7 l11,-15" fill="none" stroke="#1a7f37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text class="dg-s" x="106" y="104">Profits &amp; sales</text>
          <path d="M82,138 l5,7 l11,-15" fill="none" stroke="#1a7f37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text class="dg-s" x="106" y="142">Low debt</text>
          <path d="M82,176 l5,7 l11,-15" fill="none" stroke="#1a7f37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text class="dg-s" x="106" y="180">Steady growth</text>
        </g>
        <!-- Technical -->
        <text class="dg-t" text-anchor="middle" x="450" y="46">Technical</text>
        <text class="dg-xs" text-anchor="middle" x="450" y="64">reads the price chart</text>
        <line x1="352" y1="88" x2="352" y2="196" stroke="#cfc9ba" stroke-width="1.5"/>
        <line x1="352" y1="196" x2="566" y2="196" stroke="#cfc9ba" stroke-width="1.5"/>
        <!-- candles (trending up) -->
        <g>
          <line x1="390" y1="144" x2="390" y2="182" stroke="#57606a" stroke-width="1.5"/>
          <rect x="381" y="150" width="18" height="24" fill="#f7e2de" stroke="#c0392b" stroke-width="1.8"/>
          <line x1="430" y1="120" x2="430" y2="160" stroke="#57606a" stroke-width="1.5"/>
          <rect x="421" y="128" width="18" height="22" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.8"/>
          <line x1="470" y1="104" x2="470" y2="142" stroke="#57606a" stroke-width="1.5"/>
          <rect x="461" y="112" width="18" height="20" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.8"/>
          <line x1="510" y1="90" x2="510" y2="126" stroke="#57606a" stroke-width="1.5"/>
          <rect x="501" y="96" width="18" height="20" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.8"/>
        </g>
      </svg>
