<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="A price rally from a swing low to a swing high, then a pullback that falls back toward the 61.8 percent Fibonacci retracement line and bounces; horizontal lines mark the 23.6, 38.2, 50 and 61.8 percent levels of the rally">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <g stroke-dasharray="6 5">
          <line x1="300" y1="50" x2="540" y2="50" stroke="#cfc9ba" stroke-width="1.5" stroke-dasharray="0"/>
          <line x1="300" y1="87.8" x2="540" y2="87.8" stroke="#9aa3ad" stroke-width="1.3"/>
          <line x1="300" y1="111.1" x2="540" y2="111.1" stroke="#9aa3ad" stroke-width="1.3"/>
          <line x1="300" y1="130" x2="540" y2="130" stroke="#9aa3ad" stroke-width="1.3"/>
          <line x1="300" y1="148.9" x2="540" y2="148.9" stroke="#9a6700" stroke-width="1.8"/>
          <line x1="300" y1="210" x2="540" y2="210" stroke="#cfc9ba" stroke-width="1.5" stroke-dasharray="0"/>
        </g>
        <g class="dg-xs">
          <text x="546" y="54">0%</text>
          <text x="546" y="91.8">23.6%</text>
          <text x="546" y="115.1">38.2%</text>
          <text x="546" y="134">50%</text>
          <text x="546" y="152.9" style="fill:#9a6700">61.8%</text>
          <text x="546" y="214">100%</text>
        </g>
        <polyline fill="none" stroke="#0b6e6e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
          points="70,210 130,172 190,128 250,82 300,50"/>
        <polyline fill="none" stroke="#0b6e6e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"
          points="300,50 410,148.9 470,106"/>
        <circle cx="410" cy="148.9" r="4" fill="#9a6700"/>
        <circle cx="70" cy="210" r="3.5" fill="#0b6e6e"/>
        <circle cx="300" cy="50" r="3.5" fill="#0b6e6e"/>
        <text class="dg-s" text-anchor="end" x="64" y="206">Low</text>
        <text class="dg-s" x="306" y="44">High</text>
        <text class="dg-xs" x="416" y="170" style="fill:#9a6700">bounce near 61.8%</text>
      </svg>
