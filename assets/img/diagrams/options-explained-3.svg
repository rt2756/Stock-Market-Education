<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="Four stacked bars showing the same option's premium over time: the intrinsic value layer stays at 100 rupees while the time value layer shrinks from 95 rupees to zero at expiry">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <text class="dg-t" text-anchor="middle" x="300" y="24">One option's premium as expiry approaches (23,400 call, spot 23,500)</text>
        <line x1="70" y1="196" x2="560" y2="196" stroke="#cfc9ba" stroke-width="1.5"/>
        <!-- bar 1: 3 weeks left -->
        <rect x="88" y="151" width="64" height="45" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.5"/>
        <rect x="88" y="108" width="64" height="43" fill="#fbf3e0" stroke="#9a6700" stroke-width="1.5"/>
        <text class="dg-t" text-anchor="middle" x="120" y="100">₹195</text>
        <text class="dg-xs" text-anchor="middle" x="120" y="216">3 weeks left</text>
        <!-- bar 2: 1 week left -->
        <rect x="218" y="151" width="64" height="45" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.5"/>
        <rect x="218" y="126" width="64" height="25" fill="#fbf3e0" stroke="#9a6700" stroke-width="1.5"/>
        <text class="dg-t" text-anchor="middle" x="250" y="118">₹155</text>
        <text class="dg-xs" text-anchor="middle" x="250" y="216">1 week left</text>
        <!-- bar 3: last morning -->
        <rect x="348" y="151" width="64" height="45" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.5"/>
        <rect x="348" y="140" width="64" height="11" fill="#fbf3e0" stroke="#9a6700" stroke-width="1.5"/>
        <text class="dg-t" text-anchor="middle" x="380" y="132">₹125</text>
        <text class="dg-xs" text-anchor="middle" x="380" y="216">last morning</text>
        <!-- bar 4: at the bell -->
        <rect x="478" y="151" width="64" height="45" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.5"/>
        <text class="dg-t" text-anchor="middle" x="510" y="143">₹100</text>
        <text class="dg-xs" text-anchor="middle" x="510" y="216">at the bell</text>
        <!-- legend -->
        <rect x="140" y="228" width="12" height="12" fill="#fbf3e0" stroke="#9a6700" stroke-width="1.3"/>
        <text class="dg-xs" x="158" y="238">time value — hope, melts to zero</text>
        <rect x="368" y="228" width="12" height="12" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.3"/>
        <text class="dg-xs" x="386" y="238">intrinsic — real, survives</text>
      </svg>
