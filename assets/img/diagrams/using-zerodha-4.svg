<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="Positions are open, unsettled trades like intraday and F&amp;O; Holdings are settled shares resting in your demat. Delivery shares move from Positions to Holdings after T plus one day settlement.">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <defs>
          <marker id="kt-g" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1a7f37"/></marker>
        </defs>
        <text class="dg-t" text-anchor="middle" x="300" y="26">Positions vs Holdings</text>
        <rect x="36" y="48" width="236" height="150" rx="12" fill="#fbf3e0" stroke="#9a6700" stroke-width="1.8"/>
        <text class="dg-t" text-anchor="middle" x="154" y="78" style="fill:#9a6700">POSITIONS</text>
        <text class="dg-xs" text-anchor="middle" x="154" y="98">open · not yet settled</text>
        <text class="dg-xs" x="60" y="124">• today's intraday (MIS)</text>
        <text class="dg-xs" x="60" y="146">• open F&amp;O contracts</text>
        <text class="dg-xs" x="60" y="168">• delivery, before it settles</text>
        <rect x="328" y="48" width="236" height="150" rx="12" fill="#eaf6ec" stroke="#1a7f37" stroke-width="1.8"/>
        <text class="dg-t" text-anchor="middle" x="446" y="78" style="fill:#1a7f37">HOLDINGS</text>
        <text class="dg-xs" text-anchor="middle" x="446" y="98">settled · yours to keep</text>
        <text class="dg-xs" x="352" y="124">• shares in your demat</text>
        <text class="dg-xs" x="352" y="146">• bought as delivery (CNC)</text>
        <text class="dg-xs" x="352" y="168">• sit there until you sell</text>
        <line x1="274" y1="123" x2="326" y2="123" stroke="#1a7f37" stroke-width="2" marker-end="url(#kt-g)"/>
        <text class="dg-xs" text-anchor="middle" x="300" y="115" style="fill:#1a7f37">T+1</text>
        <text class="dg-xs" text-anchor="middle" x="300" y="228">Intraday (MIS) trades close the same day — they never reach Holdings.</text>
      </svg>
