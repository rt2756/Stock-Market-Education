<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Anatomy of a candlestick showing the open, high, low, close, the real body and the upper and lower wicks">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <!-- guide lines from candle to the right-hand price labels -->
        <g stroke="#cfc9ba" stroke-width="1.5" stroke-dasharray="3 4">
          <line x1="210" y1="36" x2="312" y2="36"/>
          <line x1="242" y1="106" x2="312" y2="106"/>
          <line x1="242" y1="192" x2="312" y2="192"/>
          <line x1="210" y1="268" x2="312" y2="268"/>
        </g>
        <!-- the candle: wick first, then body on top -->
        <line x1="210" y1="36" x2="210" y2="268" stroke="#57606a" stroke-width="2"/>
        <rect x="178" y="106" width="64" height="86" rx="2" fill="#e3f3e8" stroke="#1a7f37" stroke-width="2.5"/>
        <!-- leader lines to the left-hand part labels -->
        <g stroke="#cfc9ba" stroke-width="1.5">
          <line x1="126" y1="71" x2="208" y2="71"/>
          <line x1="126" y1="149" x2="176" y2="149"/>
          <line x1="126" y1="230" x2="208" y2="230"/>
        </g>
        <g text-anchor="end">
          <text class="dg-s" x="120" y="75">Upper wick</text>
          <text class="dg-s" x="120" y="153">Real body</text>
          <text class="dg-s" x="120" y="234">Lower wick</text>
        </g>
        <g>
          <text class="dg-s" x="320" y="40"><tspan class="dg-t">High</tspan> — the peak reached</text>
          <text class="dg-s" x="320" y="110"><tspan class="dg-t">Close</tspan> — where it ended</text>
          <text class="dg-s" x="320" y="196"><tspan class="dg-t">Open</tspan> — where it began</text>
          <text class="dg-s" x="320" y="272"><tspan class="dg-t">Low</tspan> — the bottom reached</text>
        </g>
      </svg>
