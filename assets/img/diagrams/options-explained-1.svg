<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" role="img" aria-label="Premium of 120 rupees per unit multiplied by the lot size of 75 units equals 9,000 rupees debited from your funds">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <text class="dg-t" text-anchor="middle" x="300" y="24">What one lot really costs (option buyer)</text>
        <rect x="40" y="50" width="158" height="58" rx="10" fill="#ffffff" stroke="#0b6e6e" stroke-width="1.8"/>
        <text class="dg-t" text-anchor="middle" x="119" y="76">Premium ₹120</text>
        <text class="dg-xs" text-anchor="middle" x="119" y="94">per unit</text>
        <text class="dg-t" text-anchor="middle" x="218" y="86" style="font-size:20px">×</text>
        <rect x="238" y="50" width="158" height="58" rx="10" fill="#ffffff" stroke="#0b6e6e" stroke-width="1.8"/>
        <text class="dg-t" text-anchor="middle" x="317" y="76">Lot size 75</text>
        <text class="dg-xs" text-anchor="middle" x="317" y="94">units in one lot</text>
        <text class="dg-t" text-anchor="middle" x="416" y="86" style="font-size:20px">=</text>
        <rect x="436" y="44" width="128" height="70" rx="10" fill="#e6f1f1" stroke="#0b6e6e" stroke-width="2"/>
        <text class="dg-t" text-anchor="middle" x="500" y="78" style="fill:#0b6e6e;font-size:16px">₹9,000</text>
        <text class="dg-xs" text-anchor="middle" x="500" y="98">debited from funds</text>
        <text class="dg-xs" text-anchor="middle" x="300" y="138">as a buyer, this premium is also the most you can lose</text>
      </svg>
