<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="A row of price candlesticks on top with volume bars beneath each one; a strong green breakout candle is matched by a much taller volume bar than the quiet days around it">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <text class="dg-t" x="36" y="44">Price</text>
        <text class="dg-t" x="36" y="160">Volume</text>
        <line x1="32" y1="146" x2="568" y2="146" stroke="#e7e3d8" stroke-width="1"/>
        <!-- candles -->
        <g>
          <line x1="92" y1="104" x2="92" y2="132" stroke="#57606a" stroke-width="1.5"/><rect x="81" y="110" width="22" height="16" fill="#f7e2de" stroke="#c0392b" stroke-width="1.8"/>
          <line x1="162" y1="98" x2="162" y2="126" stroke="#57606a" stroke-width="1.5"/><rect x="151" y="104" width="22" height="16" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.8"/>
          <line x1="232" y1="102" x2="232" y2="130" stroke="#57606a" stroke-width="1.5"/><rect x="221" y="108" width="22" height="16" fill="#f7e2de" stroke="#c0392b" stroke-width="1.8"/>
          <line x1="302" y1="94" x2="302" y2="124" stroke="#57606a" stroke-width="1.5"/><rect x="291" y="100" width="22" height="18" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.8"/>
          <line x1="372" y1="98" x2="372" y2="126" stroke="#57606a" stroke-width="1.5"/><rect x="361" y="104" width="22" height="16" fill="#f7e2de" stroke="#c0392b" stroke-width="1.8"/>
          <line x1="442" y1="50" x2="442" y2="120" stroke="#57606a" stroke-width="1.5"/><rect x="431" y="58" width="22" height="54" fill="#e3f3e8" stroke="#1a7f37" stroke-width="2"/>
          <line x1="512" y1="50" x2="512" y2="92" stroke="#57606a" stroke-width="1.5"/><rect x="501" y="56" width="22" height="30" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.8"/>
        </g>
        <!-- volume bars (baseline y=222) -->
        <g fill="#9aa3ad">
          <rect x="81" y="202" width="22" height="20"/>
          <rect x="151" y="196" width="22" height="26"/>
          <rect x="221" y="204" width="22" height="18"/>
          <rect x="291" y="198" width="22" height="24"/>
          <rect x="361" y="206" width="22" height="16"/>
          <rect x="501" y="188" width="22" height="34"/>
        </g>
        <rect x="431" y="164" width="22" height="58" fill="#0b6e6e"/>
        <line x1="32" y1="222" x2="568" y2="222" stroke="#cfc9ba" stroke-width="1"/>
      </svg>
