<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-label="A curve showing an option's time value draining slowly at first and then plunging as expiry day approaches">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <text class="dg-t" text-anchor="middle" x="300" y="26">An option's time-value drains toward expiry</text>
        <rect x="452" y="48" width="92" height="128" fill="#f7e2de" opacity="0.55"/>
        <line x1="60" y1="48" x2="60" y2="176" stroke="#cfc9ba" stroke-width="1.5"/>
        <line x1="60" y1="176" x2="556" y2="176" stroke="#cfc9ba" stroke-width="1.5"/>
        <path d="M70,66 C 230,80 330,100 410,126 C 470,146 514,166 544,175" fill="none" stroke="#0b6e6e" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="544" y1="48" x2="544" y2="176" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
        <text class="dg-xs" x="66" y="60">time value (₹)</text>
        <text class="dg-xs" text-anchor="middle" x="498" y="44" style="fill:#c0392b">fastest decay</text>
        <text class="dg-xs" text-anchor="end" x="540" y="196" style="fill:#c0392b">expiry day</text>
        <text class="dg-xs" x="70" y="196">more time left</text>
      </svg>
