<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="Two mini-charts. Left, a gap-up opening: today's candle opens above yesterday's close, leaving an empty gap band below it. Right, a gap-down opening: today opens below yesterday's close, leaving an empty gap band above it.">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  <line x1="300" y1="44" x2="300" y2="234" stroke="#e7e3d8" stroke-width="1"/>

  <text class="dg-t" text-anchor="middle" x="150" y="30" style="fill:#1a7f37">Gap up opening ↑</text>
  <rect x="74" y="124" width="180" height="26" fill="#fbf3e0"/>
  <text class="dg-xs" text-anchor="middle" x="164" y="141" style="fill:#9a6700">the gap — no trading here</text>
  <line x1="60" y1="150" x2="256" y2="150" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="dg-xs" text-anchor="end" x="256" y="166">yesterday's close</text>
  <line x1="110" y1="150" x2="110" y2="204" stroke="#8a8270" stroke-width="1.5"/>
  <rect x="99" y="150" width="22" height="38" fill="#efeae0" stroke="#8a8270" stroke-width="1.6"/>
  <text class="dg-xs" text-anchor="middle" x="110" y="222">yesterday</text>
  <line x1="200" y1="70" x2="200" y2="124" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="189" y="82" width="22" height="34" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.8"/>
  <text class="dg-xs" text-anchor="middle" x="200" y="222" style="fill:#1a7f37">today opens higher</text>

  <text class="dg-t" text-anchor="middle" x="450" y="30" style="fill:#c0392b">Gap down opening ↓</text>
  <rect x="346" y="104" width="180" height="26" fill="#f7e2de"/>
  <text class="dg-xs" text-anchor="middle" x="436" y="121" style="fill:#c0392b">the gap — no trading here</text>
  <line x1="344" y1="104" x2="540" y2="104" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="dg-xs" text-anchor="end" x="540" y="98">yesterday's close</text>
  <line x1="400" y1="56" x2="400" y2="104" stroke="#8a8270" stroke-width="1.5"/>
  <rect x="389" y="66" width="22" height="38" fill="#efeae0" stroke="#8a8270" stroke-width="1.6"/>
  <text class="dg-xs" text-anchor="middle" x="400" y="222">yesterday</text>
  <line x1="490" y1="130" x2="490" y2="184" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="479" y="138" width="22" height="34" fill="#f7e2de" stroke="#c0392b" stroke-width="1.8"/>
  <text class="dg-xs" text-anchor="middle" x="490" y="222" style="fill:#c0392b">today opens lower</text>
</svg>
