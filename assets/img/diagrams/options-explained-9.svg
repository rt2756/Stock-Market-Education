<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 252" role="img" aria-label="A summary table: when the stock rises, a call (CE) premium rises and a put (PE) premium falls; when the stock falls, the call falls and the put rises">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
  </style>

        <text class="dg-t" text-anchor="middle" x="300" y="26">Which way the premium moves</text>

        <rect x="24"  y="80"  width="212" height="66" fill="#ffffff"/>
        <rect x="236" y="80"  width="170" height="66" fill="#e3f3e8"/>
        <rect x="406" y="80"  width="170" height="66" fill="#f7e2de"/>
        <rect x="24"  y="146" width="212" height="66" fill="#ffffff"/>
        <rect x="236" y="146" width="170" height="66" fill="#f7e2de"/>
        <rect x="406" y="146" width="170" height="66" fill="#e3f3e8"/>

        <rect x="24" y="44" width="552" height="168" rx="12" fill="none" stroke="#cfc9ba" stroke-width="1.6"/>
        <line x1="236" y1="44" x2="236" y2="212" stroke="#cfc9ba" stroke-width="1.2"/>
        <line x1="406" y1="44" x2="406" y2="212" stroke="#cfc9ba" stroke-width="1.2"/>
        <line x1="24"  y1="80" x2="576" y2="80"  stroke="#cfc9ba" stroke-width="1.2"/>
        <line x1="24"  y1="146" x2="576" y2="146" stroke="#e7e3d8" stroke-width="1"/>

        <text class="dg-t" text-anchor="middle" x="130" y="68">Stock / index</text>
        <text class="dg-t" text-anchor="middle" x="321" y="68" style="fill:#0b6e6e">Call (CE)</text>
        <text class="dg-t" text-anchor="middle" x="491" y="68" style="fill:#c0392b">Put (PE)</text>

        <text class="dg-t" text-anchor="middle" x="130" y="118" style="fill:#1a7f37">▲  rises</text>
        <text class="dg-t" text-anchor="middle" x="321" y="118" style="fill:#1a7f37">rises  ▲</text>
        <text class="dg-t" text-anchor="middle" x="491" y="118" style="fill:#c0392b">falls  ▼</text>

        <text class="dg-t" text-anchor="middle" x="130" y="184" style="fill:#c0392b">▼  falls</text>
        <text class="dg-t" text-anchor="middle" x="321" y="184" style="fill:#c0392b">falls  ▼</text>
        <text class="dg-t" text-anchor="middle" x="491" y="184" style="fill:#1a7f37">rises  ▲</text>

        <text class="dg-xs" text-anchor="middle" x="300" y="238">Calls and puts are mirror images — a call wants a rise, a put wants a fall.</text>
      </svg>
