<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="Payoff diagrams for a call option (profit rises as price rises) and a put option (profit rises as price falls), each with loss capped at the premium">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <line x1="300" y1="36" x2="300" y2="210" stroke="#e7e3d8" stroke-width="1"/>
        <text class="dg-t" text-anchor="middle" x="155" y="40">Call — bet on a rise</text>
        <line x1="45" y1="60" x2="45" y2="200" stroke="#cfc9ba" stroke-width="1.5"/>
        <line x1="45" y1="140" x2="278" y2="140" stroke="#cfc9ba" stroke-width="1.5"/>
        <line x1="155" y1="126" x2="155" y2="178" stroke="#57606a" stroke-width="1.3" stroke-dasharray="4 4"/>
        <polyline points="48,172 155,172 193,140" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linejoin="round"/>
        <polyline points="193,140 278,74" fill="none" stroke="#1a7f37" stroke-width="2.6" stroke-linejoin="round"/>
        <text class="dg-xs" x="52" y="72" style="fill:#1a7f37">profit</text>
        <text class="dg-xs" x="52" y="196" style="fill:#c0392b">loss</text>
        <text class="dg-xs" text-anchor="middle" x="155" y="196">strike</text>
        <text class="dg-t" text-anchor="middle" x="450" y="40">Put — bet on a fall</text>
        <line x1="335" y1="60" x2="335" y2="200" stroke="#cfc9ba" stroke-width="1.5"/>
        <line x1="335" y1="140" x2="568" y2="140" stroke="#cfc9ba" stroke-width="1.5"/>
        <line x1="445" y1="126" x2="445" y2="178" stroke="#57606a" stroke-width="1.3" stroke-dasharray="4 4"/>
        <polyline points="338,74 423,140" fill="none" stroke="#1a7f37" stroke-width="2.6" stroke-linejoin="round"/>
        <polyline points="423,140 445,172 565,172" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linejoin="round"/>
        <text class="dg-xs" x="342" y="72" style="fill:#1a7f37">profit</text>
        <text class="dg-xs" x="342" y="196" style="fill:#c0392b">loss</text>
        <text class="dg-xs" text-anchor="middle" x="445" y="196">strike</text>
      </svg>
