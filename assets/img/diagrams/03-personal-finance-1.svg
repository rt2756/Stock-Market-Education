<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-label="A four-level pyramid: clear debt at the base, then emergency fund, then insurance, with investing at the top">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <polygon points="110,246 490,246 458,202 142,202" fill="#0b6e6e"/>
        <polygon points="142,202 458,202 420,158 180,158" fill="#3f9393"/>
        <polygon points="180,158 420,158 382,114 218,114" fill="#7bb5b5"/>
        <polygon points="218,114 382,114 344,70 256,70" fill="#cfe6e6"/>
        <g text-anchor="middle">
          <text class="dg-t" x="300" y="229" style="fill:#ffffff">1 · Clear expensive debt</text>
          <text class="dg-t" x="300" y="185" style="fill:#ffffff">2 · Emergency fund</text>
          <text class="dg-t" x="300" y="141" style="fill:#ffffff">3 · Insurance</text>
          <text class="dg-t" x="300" y="97" style="fill:#1f2328">4 · Invest</text>
        </g>
      </svg>
