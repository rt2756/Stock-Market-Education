          <line x1="438.9" y1="181.7" x2="438.9" y2="213.5" stroke="#1a7f37" stroke-width="1.4"/><rect x="431.7" y="204.2" width="14.4" height="9.3" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.4"/>
