<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" aria-label="Candlestick chart of the Nifty 50 index, one daily candle per trading day from 4 May to 2 June 2026, drifting sideways-to-lower in a choppy range with a support zone near 23,300 that is tested repeatedly before a bounce on 2 June">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <!-- header -->
        <text class="dg-t" x="66" y="22">Nifty 50 — daily candles</text>
        <text class="dg-xs" text-anchor="end" x="606" y="22">4 May – 2 Jun 2026</text>
        <!-- axes -->
        <line x1="66" y1="34" x2="66" y2="320" stroke="#cfc9ba" stroke-width="1"/>
        <line x1="66" y1="320" x2="606" y2="320" stroke="#cfc9ba" stroke-width="1"/>
        <!-- price gridlines + labels -->
        <g>
          <line x1="66" y1="304.5" x2="606" y2="304.5" stroke="#e7e3d8" stroke-width="1"/>
          <text class="dg-xs" text-anchor="end" x="60" y="308.5">23,200</text>
          <line x1="66" y1="227.2" x2="606" y2="227.2" stroke="#e7e3d8" stroke-width="1"/>
          <text class="dg-xs" text-anchor="end" x="60" y="231.2">23,600</text>
          <line x1="66" y1="149.9" x2="606" y2="149.9" stroke="#e7e3d8" stroke-width="1"/>
          <text class="dg-xs" text-anchor="end" x="60" y="153.9">24,000</text>
          <line x1="66" y1="72.6" x2="606" y2="72.6" stroke="#e7e3d8" stroke-width="1"/>
          <text class="dg-xs" text-anchor="end" x="60" y="76.6">24,400</text>
        </g>
