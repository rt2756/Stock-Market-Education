          <line x1="593.1" y1="235.6" x2="593.1" y2="298.9" stroke="#1a7f37" stroke-width="1.4"/><rect x="585.9" y="249.7" width="14.4" height="49.2" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.4"/>
        </g>
        <!-- support touch points (the lows that were defended) -->
        <g fill="#1a7f37">
          <circle cx="233.1" cy="275.9" r="3.6"/>
          <circle cx="258.9" cy="292.5" r="3.6"/>
          <circle cx="336.0" cy="281.9" r="3.6"/>
          <circle cx="567.4" cy="274.0" r="3.6"/>
          <circle cx="593.1" cy="298.9" r="3.6"/>
        </g>
        <!-- month's-high marker -->
        <circle cx="156.0" cy="56.8" r="3.4" fill="#c0392b"/>
        <text class="dg-xs" x="166" y="61">Month's high 24,482</text>
        <!-- support label -->
        <text class="dg-t" x="74" y="252" style="fill:#1a7f37">Support ≈ 23,300</text>
        <text class="dg-xs" x="74" y="266">defended again &amp; again</text>
        <!-- date labels -->
        <g>
          <text class="dg-xs" text-anchor="middle" x="78.9" y="338">4 May</text>
          <text class="dg-xs" text-anchor="middle" x="207.4" y="338">11 May</text>
          <text class="dg-xs" text-anchor="middle" x="336.0" y="338">18 May</text>
