<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 222" role="img" aria-label="Three horizontal bars showing how much each premium gains when Nifty rises 100 points: a deep in the money call gains about 95 rupees, an at the money call about 52, a far out of the money call about 12">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <text class="dg-t" text-anchor="middle" x="300" y="24">Nifty rises 100 points — how much does each premium gain?</text>
        <text class="dg-t" text-anchor="end" x="210" y="68">deep ITM · 23,000 CE</text>
        <text class="dg-xs" text-anchor="end" x="210" y="84">moves almost ₹ for ₹</text>
        <rect x="224" y="56" width="276" height="24" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.5"/>
        <text class="dg-t" x="508" y="73" style="fill:#1a7f37">+₹95</text>
        <text class="dg-t" text-anchor="end" x="210" y="116">ATM · 23,500 CE</text>
        <text class="dg-xs" text-anchor="end" x="210" y="132">moves about half</text>
        <rect x="224" y="104" width="151" height="24" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.5"/>
        <text class="dg-t" x="383" y="121" style="fill:#1a7f37">+₹52</text>
        <text class="dg-t" text-anchor="end" x="210" y="164">far OTM · 24,000 CE</text>
        <text class="dg-xs" text-anchor="end" x="210" y="180">barely stirs</text>
        <rect x="224" y="152" width="35" height="24" fill="#e3f3e8" stroke="#1a7f37" stroke-width="1.5"/>
        <text class="dg-t" x="267" y="169" style="fill:#1a7f37">+₹12</text>
        <text class="dg-xs" text-anchor="middle" x="300" y="208" style="fill:#57606a">traders call this speed "delta" — you only need the instinct, not the maths</text>
      </svg>
