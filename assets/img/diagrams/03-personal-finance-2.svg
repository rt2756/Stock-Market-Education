<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img" aria-label="A curve showing ₹1 lakh growing to about ₹30 lakh over 30 years, with the later years adding far more than the early ones">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <path d="M60,243 L143,238 L227,228 L310,212 L393,183 L477,131 L560,40 L560,250 L60,250 Z" fill="#e6f1f1"/>
        <polyline points="60,243 143,238 227,228 310,212 393,183 477,131 560,40" fill="none" stroke="#0b6e6e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        <line x1="60" y1="250" x2="566" y2="250" stroke="#cfc9ba" stroke-width="1.5"/>
        <text class="dg-xs" x="70" y="62">₹1 lakh invested, growing about 12% a year</text>
        <g fill="#0b6e6e">
          <circle cx="143" cy="238" r="4"/>
          <circle cx="227" cy="228" r="4"/>
          <circle cx="393" cy="183" r="4"/>
          <circle cx="560" cy="40" r="4"/>
        </g>
        <g class="dg-t">
          <text text-anchor="middle" x="143" y="224">₹1.76L</text>
          <text text-anchor="middle" x="232" y="214">₹3.1L</text>
          <text text-anchor="middle" x="393" y="169">₹9.6L</text>
          <text text-anchor="end" x="566" y="34">₹30L</text>
        </g>
        <g class="dg-xs" text-anchor="middle" fill="#57606a">
          <text x="60" y="268">0</text>
          <text x="143" y="268">5</text>
          <text x="227" y="268">10</text>
          <text x="393" y="268">20</text>
          <text x="560" y="268">30</text>
          <text x="312" y="285" style="font-style:italic">years &#8594;</text>
        </g>
      </svg>
