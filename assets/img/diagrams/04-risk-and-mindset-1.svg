<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-label="A market cycle curve where greed peaks at the top just before a fall, and fear peaks at the bottom just before a recovery">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <path d="M40,205 C130,205 175,92 255,82 C345,72 385,216 470,216 C515,216 545,200 560,188" fill="none" stroke="#0b6e6e" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="255" cy="82" r="5" fill="#c0392b"/>
        <circle cx="470" cy="216" r="5" fill="#1a7f37"/>
        <text class="dg-t" text-anchor="middle" x="255" y="50" style="fill:#c0392b">Greed peaks</text>
        <text class="dg-xs" text-anchor="middle" x="255" y="67">“it only goes up!” — buys at the top</text>
        <text class="dg-t" text-anchor="middle" x="470" y="246" style="fill:#1a7f37">Fear peaks</text>
        <text class="dg-xs" text-anchor="middle" x="470" y="263">“get me out!” — sells at the bottom</text>
        <text class="dg-xs" text-anchor="middle" x="152" y="162" style="fill:#57606a">optimism</text>
        <text class="dg-xs" text-anchor="middle" x="378" y="138" style="fill:#57606a">anxiety</text>
      </svg>
