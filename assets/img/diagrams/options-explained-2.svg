<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 232" role="img" aria-label="A number line of strikes from 23,000 to 24,000 with the spot at 23,500; for a call, strikes below spot are in the money, near spot at the money, above spot out of the money">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <text class="dg-t" text-anchor="middle" x="300" y="24">Moneyness of a call — spot at 23,500</text>
        <text class="dg-t" text-anchor="middle" x="300" y="58" style="fill:#57606a">spot 23,500 ↓</text>
        <rect x="50" y="86" width="212" height="44" fill="#e3f3e8" opacity="0.85"/>
        <rect x="262" y="86" width="76" height="44" fill="#fbf3e0" opacity="0.9"/>
        <rect x="338" y="86" width="212" height="44" fill="#f7e2de" opacity="0.85"/>
        <text class="dg-t" text-anchor="middle" x="156" y="105" style="fill:#1a7f37">ITM</text>
        <text class="dg-xs" text-anchor="middle" x="156" y="121">in the money</text>
        <text class="dg-t" text-anchor="middle" x="300" y="105" style="fill:#9a6700">ATM</text>
        <text class="dg-xs" text-anchor="middle" x="300" y="121">at the money</text>
        <text class="dg-t" text-anchor="middle" x="444" y="105" style="fill:#c0392b">OTM</text>
        <text class="dg-xs" text-anchor="middle" x="444" y="121">out of the money</text>
        <line x1="300" y1="64" x2="300" y2="136" stroke="#57606a" stroke-width="1.3" stroke-dasharray="4 4"/>
        <line x1="50" y1="140" x2="550" y2="140" stroke="#cfc9ba" stroke-width="1.5"/>
        <g stroke="#cfc9ba" stroke-width="1.3">
          <line x1="50" y1="135" x2="50" y2="145"/>
          <line x1="175" y1="135" x2="175" y2="145"/>
          <line x1="300" y1="135" x2="300" y2="145"/>
          <line x1="425" y1="135" x2="425" y2="145"/>
          <line x1="550" y1="135" x2="550" y2="145"/>
        </g>
        <g text-anchor="middle">
          <text class="dg-xs" x="50" y="162">23,000</text>
          <text class="dg-xs" x="175" y="162">23,250</text>
          <text class="dg-xs" x="300" y="162">23,500</text>
          <text class="dg-xs" x="425" y="162">23,750</text>
          <text class="dg-xs" x="550" y="162">24,000</text>
          <text class="dg-xs" x="156" y="188">already worth something</text>
          <text class="dg-xs" x="300" y="188">the coin-toss strike</text>
          <text class="dg-xs" x="444" y="188">pure hope — needs a move</text>
        </g>
        <text class="dg-xs" text-anchor="middle" x="300" y="216" style="fill:#57606a">a put is the mirror image: strikes above spot are ITM, below are OTM</text>
      </svg>
