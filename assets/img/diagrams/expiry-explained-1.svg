<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 196" role="img" aria-label="A month timeline with four weekly expiries marked; the last weekly is also the monthly expiry and is the largest">
  <style>
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dg-t  { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .dg-s  { fill: #57606a; font-size: 12px; }
    .dg-xs { fill: #57606a; font-size: 11px; }
    .dg-b  { font-weight: 700; }
  </style>
  
        <text class="dg-t" text-anchor="middle" x="300" y="26">A month of expiries</text>
        <line x1="40" y1="116" x2="560" y2="116" stroke="#cfc9ba" stroke-width="1.5"/>
        <g text-anchor="middle">
          <!-- week 1-3 -->
          <line x1="130" y1="116" x2="130" y2="86" stroke="#0b6e6e" stroke-width="2"/>
          <circle cx="130" cy="82" r="6" fill="#0b6e6e"/>
          <text class="dg-xs" x="130" y="68">weekly</text>
          <text class="dg-xs" x="130" y="136">Week 1</text>
          <line x1="260" y1="116" x2="260" y2="86" stroke="#0b6e6e" stroke-width="2"/>
          <circle cx="260" cy="82" r="6" fill="#0b6e6e"/>
          <text class="dg-xs" x="260" y="68">weekly</text>
          <text class="dg-xs" x="260" y="136">Week 2</text>
          <line x1="390" y1="116" x2="390" y2="86" stroke="#0b6e6e" stroke-width="2"/>
          <circle cx="390" cy="82" r="6" fill="#0b6e6e"/>
          <text class="dg-xs" x="390" y="68">weekly</text>
          <text class="dg-xs" x="390" y="136">Week 3</text>
          <!-- week 4 = monthly -->
          <line x1="510" y1="116" x2="510" y2="78" stroke="#1a7f37" stroke-width="2.5"/>
          <circle cx="510" cy="72" r="9" fill="#1a7f37"/>
          <text class="dg-t" x="510" y="58" style="fill:#1a7f37">monthly</text>
          <text class="dg-xs" x="510" y="136">Week 4</text>
        </g>
        <!-- month bracket -->
        <path d="M130,158 L130,166 L510,166 L510,158" fill="none" stroke="#57606a" stroke-width="1.3"/>
        <text class="dg-xs" text-anchor="middle" x="320" y="184">one month — four weekly expiries, the last one also the monthly</text>
      </svg>
